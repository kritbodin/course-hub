<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายวิชาที่สอน · อาจารย์กริชบดินทร์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/style.css">
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "943bd094c77746988df3268cecfab155"}'></script>
</head>
<body>

  <header class="index-header">
    <div class="index-header-inner">
      <div>
        <p class="index-univ">มหาวิทยาลัยราชภัฏศรีสะเกษ</p>
        <h1 class="index-title">รายวิชาที่สอน</h1>
        <p class="index-instructor">อาจารย์กริชบดินทร์ ผิวหอม · สาขาวิชาคอมพิวเตอร์</p>
      </div>
    </div>
  </header>

  <main class="index-main">
    <div class="course-grid">
      {% for course in courses %}
      <a class="course-card" href="{{ course.code }}.html">
        <div class="card-top">
          <span class="card-code">{{ course.code }}</span>
          <span class="card-term">{{ course.semester }}</span>
        </div>
        <p class="card-name">{{ course.name }}</p>
        <span class="card-arrow">→</span>
      </a>
      {% endfor %}
    </div>
  </main>

</body>
</html>
